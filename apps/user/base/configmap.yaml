apiVersion: v1
kind: ConfigMap
metadata:
  name: user-service
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: foodkoala
data:
  NODE_ENV: "production"
  PORT: "3002"
  MAX_ADDRESSES_PER_USER: "10"
  MAX_FAVOURITES_PER_USER: "100"
  RESTAURANT_SERVICE_URL: "http://restaurant-service:3003"
  RESTAURANT_SERVICE_TIMEOUT_MS: "2000"
