apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: foodkoala
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-service
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: foodkoala
    spec:
      serviceAccountName: order-service
      containers:
        - name: order-service
          image: ghcr.io/foodkoala/order-service:<tag> # image tag will be set using ArgoCD later
          ports:
            - name: http
              containerPort: 3006
          envFrom:
            - configMapRef:
                name: order-service
            - secretRef:
                name: order-service
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources: {} # resource requests/limits will be set later