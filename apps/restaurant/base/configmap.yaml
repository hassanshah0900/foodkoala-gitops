apiVersion: v1
kind: ConfigMap
metadata:
  name: restaurant-service
  labels:
    app.kubernetes.io/name: restaurant-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: foodkoala
data:
  NODE_ENV: "production"
  PORT: "3003"
  MAX_ZONES_PER_RESTAURANT: "10"
  KAFKA_BROKERS: "kafka:29092"
  KAFKA_CLIENT_ID: "restaurant-service"
  KAFKA_GROUP_ID: "restaurant-service"
  OUTBOX_POLL_MS: "500"
  OUTBOX_BATCH_SIZE: "100"
  OUTBOX_RETENTION_DAYS: "7"
