apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restaurant-service-default-deny
  labels:
    app.kubernetes.io/name: restaurant-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: foodkoala
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: restaurant-service
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restaurant-service-allow-dns
  labels:
    app.kubernetes.io/name: restaurant-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: foodkoala
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: restaurant-service
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restaurant-service-allow-ingress-api-gateway
  labels:
    app.kubernetes.io/name: restaurant-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: foodkoala
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: restaurant-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
      ports:
        - protocol: TCP
          port: 3003
---
