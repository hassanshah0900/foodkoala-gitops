apiVersion: apps/v1
kind: Deployment
metadata:
  name: restaurant-service
  labels:
    app.kubernetes.io/name: restaurant-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: foodkoala
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: restaurant-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: restaurant-service
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: foodkoala
    spec:
      serviceAccountName: restaurant-service
      containers:
        - name: restaurant-service
          image: ghcr.io/foodkoala/restaurant-service:<tag> # image tag will be set using ArgoCD later
          ports:
            - name: http
              containerPort: 3003
          envFrom:
            - configMapRef:
                name: restaurant-service
            - secretRef:
                name: restaurant-service
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # starting values, tune from observed usage; cpu limit is high so it only stops a runaway process
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi