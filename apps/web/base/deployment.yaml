apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: foodkoala
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: foodkoala
    spec:
      serviceAccountName: web
      containers:
        - name: web
          image: ghcr.io/foodkoala/web:<tag> # image tag will be set using ArgoCD later
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: web
          # no readiness/liveness probes yet: web has no health endpoint
          resources: {} # resource requests/limits will be set later