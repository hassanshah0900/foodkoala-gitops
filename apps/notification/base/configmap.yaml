apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: foodkoala
data:
  NODE_ENV: "production"
  PORT: "3007"
  KAFKA_BROKERS: "kafka:29092"
  KAFKA_GROUP_ID: "notification-service"
  SMS_PROVIDER: "twilio"
  TWILIO_FROM: ""                      # fill in your Twilio sender number or Messaging Service ID
  TWILIO_API_URL: "https://api.twilio.com"
  SMS_TIMEOUT_MS: "5000"
  SMS_POLL_MS: "1000"
  SMS_MAX_ATTEMPTS: "5"
