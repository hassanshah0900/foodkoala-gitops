apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: foodkoala
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-service
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: foodkoala
    spec:
      serviceAccountName: notification-service
      containers:
        - name: notification-service
          image: ghcr.io/foodkoala/notification-service:<tag> # image tag will be set using ArgoCD later
          ports:
            - name: http
              containerPort: 3007
          envFrom:
            - configMapRef:
                name: notification-service
            - secretRef:
                name: notification-service
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources: {} # resource requests/limits will be set later