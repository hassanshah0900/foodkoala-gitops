apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-service
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: foodkoala
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: auth-service
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: foodkoala/auth-service
        property: DATABASE_URL
    - secretKey: REDIS_URL
      remoteRef:
        key: foodkoala/auth-service
        property: REDIS_URL
    - secretKey: OTP_PEPPER
      remoteRef:
        key: foodkoala/auth-service
        property: OTP_PEPPER
    - secretKey: JWT_PRIVATE_KEY
      remoteRef:
        key: foodkoala/auth-service
        property: JWT_PRIVATE_KEY
    - secretKey: TWILIO_ACCOUNT_SID
      remoteRef:
        key: foodkoala/auth-service
        property: TWILIO_ACCOUNT_SID
    - secretKey: TWILIO_AUTH_TOKEN
      remoteRef:
        key: foodkoala/auth-service
        property: TWILIO_AUTH_TOKEN
    - secretKey: ADMIN_PHONES
      remoteRef:
        key: foodkoala/auth-service
        property: ADMIN_PHONES