apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: foodkoala
data:
  NODE_ENV: "production"
  PORT: "3001"
  JWT_ISSUER: "foodkoala-auth"
  JWT_AUDIENCE: "foodkoala"
  ACCESS_TOKEN_TTL_SECONDS: "900"
  REFRESH_TOKEN_TTL_DAYS: "30"
  OTP_TTL_SECONDS: "300"
  OTP_RESEND_SECONDS: "60"
  OTP_MAX_PER_HOUR: "5"
  OTP_MAX_ATTEMPTS: "5"
  SMS_PROVIDER: "twilio"
  TWILIO_FROM: ""                      # fill in your Twilio sender number
  TWILIO_API_URL: "https://api.twilio.com"
  SMS_TIMEOUT_MS: "5000"