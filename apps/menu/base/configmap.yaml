apiVersion: v1
kind: ConfigMap
metadata:
  name: menu-service
  labels:
    app.kubernetes.io/name: menu-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: foodkoala
data:
  NODE_ENV: "production"
  PORT: "3004"
  RESTAURANT_SERVICE_URL: "http://restaurant-service:3003"
  RESTAURANT_SERVICE_TIMEOUT_MS: "2000"
  MAX_CATEGORIES_PER_RESTAURANT: "50"
  MAX_ITEMS_PER_RESTAURANT: "300"
  KAFKA_BROKERS: "kafka:29092"
  KAFKA_CLIENT_ID: "menu-service"
  OUTBOX_POLL_MS: "500"
  OUTBOX_BATCH_SIZE: "100"
  OUTBOX_RETENTION_DAYS: "7"
