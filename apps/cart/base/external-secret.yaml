apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cart-service
  labels:
    app.kubernetes.io/name: cart-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: foodkoala
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: cart-service
    creationPolicy: Owner
  data:
    - secretKey: REDIS_URL
      remoteRef:
        key: foodkoala/cart-service
        property: REDIS_URL
