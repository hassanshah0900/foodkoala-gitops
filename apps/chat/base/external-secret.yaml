apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chat-service
  labels:
    app.kubernetes.io/name: chat-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: foodkoala
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: chat-service
    creationPolicy: Owner
  data:
    - secretKey: MONGO_URL
      remoteRef:
        key: foodkoala/chat-service
        property: MONGO_URL
    - secretKey: REDIS_URL
      remoteRef:
        key: foodkoala/chat-service
        property: REDIS_URL
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: foodkoala/chat-service
        property: S3_ACCESS_KEY
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: foodkoala/chat-service
        property: S3_SECRET_KEY
