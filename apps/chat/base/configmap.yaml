apiVersion: v1
kind: ConfigMap
metadata:
  name: chat-service
  labels:
    app.kubernetes.io/name: chat-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: foodkoala
data:
  PORT: "8083"
  MONGO_DB: "chat"
  KAFKA_BROKERS: "kafka:29092"
  KAFKA_GROUP_ID: "chat-service"
  S3_ENDPOINT: "s3:8333"
  S3_BUCKET: "chat-photos"
  S3_USE_SSL: "false"
