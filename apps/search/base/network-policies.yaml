apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: search-service-default-deny
  labels:
    app.kubernetes.io/name: search-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: foodkoala
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: search-service
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: search-service-allow-dns
  labels:
    app.kubernetes.io/name: search-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: foodkoala
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: search-service
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
